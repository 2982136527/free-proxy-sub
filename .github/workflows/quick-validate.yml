name: Quick Validate (精选更新)

on:
  schedule:
    - cron: '30 * * * *'      # 每 1 小时（错开整点，避免与 Full Update 排队）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore proxy DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/
          key: proxy-db-quick-${{ github.run_id }}
          restore-keys: |
            proxy-db-

      - name: Install mihomo (protocol-level validation)
        run: |
          set -e
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/mihomo-linux-amd64-${TAG}.gz"
          gunzip mihomo.gz && chmod +x mihomo
          echo "MIHOMO_BIN=$PWD/mihomo" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Quick validate (no crawl) + generate all files
        run: python cli.py --validate-only --require-real-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Commit subscription files (raw 镜像链接依赖仓库内容)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet && exit 0
          git commit -m "chore: quick refresh [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
